# OAuth2 API endpoints

oauth2_authorize:
  get:
    tags: [oauth2]
    summary: OAuth2 authorization endpoint
    description: |
      Initiate OAuth2 authorization flow. Supports both Authorization Code and Implicit Grant flows.
      The fuelrats.com authorisation page calls this endpoint for the signed-in user.

      If the user has previously granted the requested permissions to the client, the response
      carries the redirect back with the authorization code or token, and no consent screen is shown.

      Public clients must use `response_type=code` with PKCE (`code_challenge` and
      `code_challenge_method=S256`), their registered `redirect_uri`, and only named permission scopes.

      **Authentication Required:** the user's own full credential: a bearer token with the `*` scope
      that was not issued to a public client, such as the token the website holds. A token with
      narrower scope, or any token of a public client, gets 403.
    security:
      - bearerAuth: []
    parameters:
      - name: response_type
        in: query
        required: true
        description: OAuth2 response type
        schema:
          type: string
          enum: [code, token]
          description: |
            - `code`: Authorization Code flow (recommended, the only one for public clients)
            - `token`: Implicit Grant flow (not recommended; browser apps should use `code` as a public client)
      - name: client_id
        in: query
        required: true
        description: OAuth2 client identifier
        schema:
          type: string
          format: uuid
      - name: redirect_uri
        in: query
        required: true
        description: |
          Redirect URI after authorization. For Implicit Grant (token) and for public clients, this
          must match exactly the redirectUri stored in the OAuth client configuration.
        schema:
          type: string
          format: uri
      - name: scope
        in: query
        required: true
        description: |
          Space-separated list of requested permissions.
          Available scopes: `users.read`, `users.write`, `users.write.me`, `rats.read`, `rats.write`,
          `rescues.read`, `rescues.write`, `irc.login`, and namespace-specific scopes.
          Public clients may request only named permission scopes, not `*`, `openid`, `profile`,
          `email` or `groups`.
        schema:
          type: string
          example: "users.read rats.read"
      - name: state
        in: query
        required: true
        description: |
          Client state parameter for CSRF protection. This value will be returned unchanged
          in the callback, with the code or with an error, to verify the response matches the request.
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        description: |
          PKCE (RFC 7636) code challenge: the base64url-encoded SHA-256 of the code verifier,
          43 characters. Required for public clients. When it is sent, the token exchange must
          present the matching `code_verifier`.
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
      - name: code_challenge_method
        in: query
        required: false
        description: PKCE challenge method. Required with `code_challenge`; only `S256` is accepted.
        schema:
          type: string
          enum: [S256]
    responses:
      '200':
        description: |
          Authorization consent screen data when user consent is needed. Otherwise an object with
          `redirect`: the callback URL with the authorization code or token (consent given before),
          or with `error`, `error_description` and `state` (an invalid request).
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId:
                  type: string
                  description: Transaction ID for the authorization decision
                scopes:
                  type: array
                  items:
                    type: string
                  description: List of requested permission scopes
                clientId:
                  type: string
                  format: uuid
                  description: OAuth client ID
                clientName:
                  type: string
                  description: Human-readable name of the OAuth client
                firstParty:
                  type: boolean
                  description: Whether this is a first-party Fuel Rats client
                state:
                  type: string
                  description: State parameter from the request
                redirect:
                  type: string
                  format: uri
                  description: Callback URL with the code, token or error, when no consent screen is needed
            examples:
              consent:
                value:
                  transactionId: "abc123def456"
                  scopes: ["users.read", "rats.read"]
                  clientId: "110e8400-e29b-41d4-a716-446655440001"
                  clientName: "My Rescue Tool"
                  firstParty: false
                  state: "xyz789"
              code:
                value:
                  redirect: "https://example.com/callback?code=abc123&state=xyz789"
              error:
                value:
                  redirect: "https://example.com/callback?error=invalid_request&error_description=code_challenge&state=xyz789"
      '400':
        description: |
          Invalid `client_id` or `redirect_uri` (unknown client, or a public client's redirect URI
          that is not its registered one). Shown to the user and never redirected.
        content:
          application/vnd.api+json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      '403':
        description: The request is authenticated with a token narrower than the user's full credential
        content:
          application/vnd.api+json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

  post:
    tags: [oauth2]
    summary: OAuth2 authorization decision
    description: |
      Handle user's authorization decision (allow or deny access).
      This endpoint is called after the user views the consent screen.
      A denial returns the callback URL with `error=access_denied` and the request's `state`.

      **Authentication Required:** the same full credential as `GET /oauth2/authorize`; a token with
      narrower scope, or any token of a public client, gets 403
    security:
      - bearerAuth: []
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [transactionId, allow]
            properties:
              transactionId:
                type: string
                description: Transaction ID from the authorization request
              allow:
                type: boolean
                description: Whether the user allows access (true) or denies it (false)
          example:
            transactionId: "abc123def456"
            allow: true
    responses:
      '200':
        description: Authorization decision processed
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect:
                  type: string
                  format: uri
                  description: Redirect URL with authorization code/token or error
            example:
              redirect: "https://example.com/callback?code=AUTH_CODE_HERE&state=xyz789"
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '403':
        description: Invalid transaction, user mismatch, or a token narrower than the user's full credential
        content:
          application/vnd.api+json:
            schema:
              $ref: '../components/schemas.yaml#/Error'

oauth2_token:
  post:
    tags: [oauth2]
    summary: OAuth2 token endpoint
    description: |
      Exchange authorization code for access token or use Resource Owner Password Credentials (ROPC).
      
      Supports grant types:
      - `authorization_code`: Exchange code for token (standard OAuth2 flow)
      - `password`: Resource Owner Password Credentials (first-party clients only)

      A public client authenticates with `client_id` in the body and no secret (token endpoint auth
      method `none`) and may use only `authorization_code`, with the PKCE `code_verifier`. Its tokens
      expire after 12 hours, given as `expires_in`.

      **Authentication Required:** Basic authentication with client credentials, or `client_id` alone
      for a public client
    security:
      - basicAuth: []
      - {}
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            oneOf:
              - type: object
                required: [grant_type, code, redirect_uri]
                properties:
                  grant_type:
                    type: string
                    enum: [authorization_code]
                  code:
                    type: string
                    description: Authorization code from the authorize endpoint
                  redirect_uri:
                    type: string
                    format: uri
                    description: Must match the redirect_uri used in the authorization request
                  code_verifier:
                    type: string
                    description: |
                      PKCE code verifier (RFC 7636, 43 to 128 characters). Required when the authorization
                      request carried a `code_challenge`. A wrong or missing verifier gives `invalid_grant`
                      and consumes the code.
                  client_id:
                    type: string
                    format: uuid
                    description: Client ID, for a public client that sends no Basic authentication
              - type: object
                required: [grant_type, username, password]
                properties:
                  grant_type:
                    type: string
                    enum: [password]
                  username:
                    type: string
                    description: User's email address
                  password:
                    type: string
                    description: User's password
                  code:
                    type: string
                    description: 2FA code if user has 2FA enabled
                  scope:
                    type: string
                    description: Space-separated scopes (defaults to "*" for full access)
          examples:
            authorization_code:
              value:
                grant_type: authorization_code
                code: "AUTH_CODE_HERE"
                redirect_uri: "https://example.com/callback"
            public_client:
              value:
                grant_type: authorization_code
                client_id: "110e8400-e29b-41d4-a716-446655440001"
                code: "AUTH_CODE_HERE"
                redirect_uri: "https://example.com/callback.html"
                code_verifier: "CODE_VERIFIER_HERE"
            password:
              value:
                grant_type: password
                username: "user@example.com"
                password: "secret123"
                code: "123456"
                scope: "users.read rats.read"
    responses:
      '200':
        description: Access token response
        content:
          application/json:
            schema:
              type: object
              required: [access_token, token_type]
              properties:
                access_token:
                  type: string
                  description: Bearer access token
                token_type:
                  type: string
                  enum: [bearer]
                  description: Token type (always "bearer")
                expires_in:
                  type: integer
                  description: Seconds until the token expires (43200); only for tokens issued to a public client
                scope:
                  type: string
                  description: Granted scopes (only for implicit grant)
            example:
              access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              token_type: "bearer"
      '400':
        description: |
          Invalid request or grant. `unauthorised_client` is returned for a grant type the client may not
          use, such as `password` for a public client.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request, invalid_client, invalid_grant, unauthorised_client, unsupported_grant_type, invalid_scope]
                error_description:
                  type: string
              example:
                error: "invalid_grant"
                error_description: "Invalid authorization code"
      '401':
        description: Invalid client credentials
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_client]
                error_description:
                  type: string
              example:
                error: "invalid_client"
                error_description: "Client authentication failed"

oauth2_revoke:
  post:
    tags: [oauth2]
    summary: Revoke access token
    description: |
      Revoke a specific access token. The token will immediately become invalid.
      Only tokens issued to the authenticated client can be revoked; any other token value is left alone.

      A public client revokes with `client_id` in the body and no secret. Revoking one of its tokens
      deletes every token of that user for the client, which also removes the user's consent, so the
      next login shows the consent screen again.

      **Authentication Required:** Basic authentication with client credentials, or `client_id` alone
      for a public client
    security:
      - basicAuth: []
      - {}
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
                description: The access token to revoke
              client_id:
                type: string
                format: uuid
                description: Client ID, for a public client that sends no Basic authentication
          example:
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    responses:
      '200':
        description: Token revoked successfully (returns empty object even if token didn't exist)
        content:
          application/json:
            schema:
              type: object
            example: {}
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [invalid_request]
                error_description:
                  type: string
              example:
                error: "invalid_request"
                error_description: "Missing token parameter"
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

oauth2_revokeall:
  post:
    tags: [oauth2]
    summary: Revoke all client tokens
    description: |
      Revoke all access tokens issued to the authenticated client.
      This is useful when a client's credentials may have been compromised.
      Public clients are refused, because their client ID is not a secret.

      **Authentication Required:** Basic authentication with client credentials
    security:
      - basicAuth: []
    responses:
      '200':
        description: All tokens revoked successfully
        content:
          application/json:
            schema:
              type: object
            example: {}
      '400':
        description: The client is a public client
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
                  enum: [unauthorised_client]
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'